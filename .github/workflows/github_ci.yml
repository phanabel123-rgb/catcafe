name: GitHub CI

on:
    push:
        branches: [master]
    workflow_dispatch:


    job1:
        name: Build and Compile
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  java-version: '17'
                  distribution: 'temurin'
                  cache: gradle

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Compile Java
              run: ./gradlew :app:compileJava


    job2:
        name: Run JUnit Tests
        needs: job1
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  java-version: '17'
                  distribution: 'temurin'
                  cache: gradle

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Run Tests
              run: ./gradlew :app:test

  
    job3:
        name: Check Formatting
        needs: job2
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  java-version: '17'
                  distribution: 'temurin'
                  cache: gradle

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Check Spotless
              run: ./gradlew :app:spotlessCheck

name: GitHub CI

on:
    push:
        branches: [main, master]
    workflow_dispatch:

jobs:
    job1:
        name: Build and Compile
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  java-version: '17'
                  distribution: 'temurin'
                  cache: gradle

            - name: Grant execute permission
                
              run: chmod +x gradlew
              working-directory: catcafe

            - name: Compile Java
              run: ./gradlew :app:compileJava
              working-directory: catcafe

    job2:
        name: Run JUnit Tests
        needs: job1
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  java-version: '17'
                  distribution: 'temurin'
                  cache: gradle

            - name: Run Tests
              run: ./gradlew :app:test
              working-directory: catcafe

    job3:
        name: Check Formatting
        needs: job2
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  java-version: '17'
                  distribution: 'temurin'
                  cache: gradle

            - name: Check Spotless
              run: ./gradlew :app:spotlessCheck
              working-directory: catcafe
